<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成品替换效果对比</title><link rel="stylesheet" href="./style.css?v=054eda69e3c1"></head><body>
<header><h1>成品替换效果对比</h1><nav class="scopes" aria-label="测试范围"><a href="./" data-scope="80">80组四模型全量</a></nav></header>
<div class="shell"><aside class="sidebar" aria-label="样本"><div class="filters"><input id="find" type="search" placeholder="搜索序号或原编号" aria-label="搜索样本"><div class="filterrow"><select id="space" aria-label="空间筛选"><option value="">全部空间</option><option>客餐厅</option><option>卧室</option><option>书房</option></select><select id="kind" aria-label="品数筛选"><option value="">全部品数</option><option value="1">单品</option><option value="2">双品</option><option value="3">三品</option></select></div><select id="grade" aria-label="效果筛选"><option value="">全部效果</option><option value="failed">含不通过结果</option><option value="可用">含可用结果</option><option value="基本可用">含基本可用结果</option><option value="基本不可用">含基本不可用结果</option><option value="不可用">含不可用结果</option><option value="human">已人工复评</option><option value="missing">含待出图</option></select></div><div class="listhead"><span id="count">读取样本…</span><button class="textbutton" id="refresh">刷新</button></div><nav id="cases" aria-label="样本列表"></nav><small class="reviewnotice">当前评级已锁定</small></aside>
<main><div class="casebar"><div><h2 id="title">读取样本…</h2><span id="caseinfo"></span></div><div class="tools"><select id="modelview" aria-label="模型视图"></select><button id="compare" aria-pressed="false">拖动对比</button><button id="reset" title="复原全部图片">复原</button><button id="prev" aria-label="上一组">‹</button><span id="position"></span><button id="next" aria-label="下一组">›</button></div></div><div id="tiles" class="tiles"></div></main>
<section class="references" aria-label="场景图与参考图"><div class="refheading">场景图与参考图</div><div id="refs"></div><details id="promptdetails"><summary>本组提示词</summary><p id="prompt"></p><p id="findings"></p><button id="copy">复制提示词</button></details></section></div>
<dialog id="zoom"><div class="viewer"><div class="viewerbar"><strong id="zoomtitle"></strong><div class="viewertools"><select id="zoomtarget" aria-label="查看图片"></select><button id="zoomcompare" aria-pressed="false">拖动对比</button><button id="zoomreset">适应窗口</button><button id="zoomprev" aria-label="上一个模型">‹</button><button id="zoomnext" aria-label="下一个模型">›</button><button id="close">关闭</button></div></div><div class="viewerbody"><div class="viewerresult"><div id="large" class="tile"></div><div id="zoomreview"></div></div></div></div></dialog>
<div id="selectmenu" class="selectmenu" role="listbox" tabindex="-1" hidden></div><div id="toast" role="status" aria-live="polite"></div><script src="./app.js?v=3cfc2b16e9b2"></script></body></html>
